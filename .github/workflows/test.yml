name: Tests

# Safe CI: checkout + run the local test suite only.
# No SSH, no production secrets, no deployment, no scp/rsync.

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tests compare files against origin/main

      - name: Run test suite
        run: bash tests/run_tests.sh
